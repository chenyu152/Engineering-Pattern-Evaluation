[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-pattern-evaluation"
version = "0.1.0"
description = "Engineering Memory & Decision Engine for Coding Agents based on CBR and MADR standards"
authors = [
    {name = "AI Engineering Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "chromadb>=0.4.22",
    "networkx>=3.1",
    "tree-sitter>=0.21.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.2",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.11.0",
    "ruff>=0.1.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
